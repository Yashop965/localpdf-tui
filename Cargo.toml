[package]
name = "localpdf-tui"
version = "0.1.0"
edition = "2024"
description = "LocalPDF-TUI — a private, terminal-native PDF toolkit (merge/split) with an agent-native headless JSON mode"

[dependencies]
lopdf = { version = "0.46", features = ["embed_image"] }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
