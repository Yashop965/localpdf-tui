[package]
name = "localpdf-tui"
version = "0.1.0"
edition = "2024"
description = "LocalPDF-TUI — a private, terminal-native PDF toolkit (merge/split) with an agent-native headless JSON mode"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
lopdf = "0.46"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
